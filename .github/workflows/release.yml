name: release

# Publishes @transynq/sdk to npm with provenance.
# Authentication: npm trusted publishing (OIDC, npm >= 11.5.1) when no NPM_TOKEN secret is set; otherwise the NPM_TOKEN
# secret (needed for the very first publish of a new package). Trigger: a GitHub release with tag vX.Y.Z matching
# package.json, or a manual run (dry run by default: build, test, npm pack and npm publish --dry-run). See PUBLISHING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build, test and npm publish --dry-run only"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "Package version: ${version}"
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi

      - run: npm ci

      - name: Type-check, lint, test, build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run examples

      - name: Package contents
        run: npm pack --dry-run

      - name: Publish dry run
        run: npm publish --dry-run --access public

  publish:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # OIDC: npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "Authenticating with the NPM_TOKEN secret"
            # the file holds a reference to the variable, never the token itself
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "${HOME}/.npmrc"
          else
            echo "Authenticating with npm trusted publishing (OIDC)"
            unset NODE_AUTH_TOKEN
          fi
          npm publish --provenance --access public
